<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Contact</h1>
  <form method="post" action="/contact/send">
    <p><input name="name" placeholder="Your name"></p>
    <p><input name="message" placeholder="Your message" size="40"></p>
    <button>Send</button>
  </form>
  <p>The message is printed in the terminal running <code>fourfold dev</code>.</p>
  <p><a href="/">Back</a></p>
</body>
</html>
